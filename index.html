    <button class="close-btn" onclick="toggleSettingsMenu()">×</button>
  <h1 data-i18n="settings" class="settingstext"></h1>

  <div class="setting-item">
    <label data-i18n="sound-volume"></label>
    <input type="range" id="volumeControl" min="0" max="100" value="70" onchange="setVolume(this.value)">
  </div>

  <div class="setting-item">
    <label data-i18n="app-language"></label>
    <select id="languageSelect" onchange="changeLanguage(this.value)">
      <option value="en">English</option>
      <option value="az">Azərbaycan</option>
      <option value="es">Español</option>
      <option value="tr">Türkçe</option>
      <option value="ru">Русский</option>
    </select>
  </div>

<label data-i18n="account-options"></label>
  <div class="setting-item">
    <button data-i18n="change-password" onclick="togglePasswordForm()"></button>
  </div>
    <div id="password-form" class="password-form hidden">
    <input type="password" id="current-password" data-i18n-placeholder="current-password" placeholder="" />
    <input type="password" id="new-password" data-i18n-placeholder="new-password" placeholder="" />
    <input type="password" id="confirm-password" data-i18n-placeholder="new-password-again" placeholder="" />
    <button data-i18n="submit" onclick="changePassword()"></button>
    <p id="password-update-message"></p>
 </div>
 
<script>
  const volumeSlider = document.getElementById("volumeControl");
  
window.addEventListener('DOMContentLoaded', () => {
  const savedVolume = localStorage.getItem('ambientVolume');
  if (savedVolume !== null) {
    const percent = Math.round(parseFloat(savedVolume) * 100);
    volumeSlider.value = percent;
  } else {
    volumeSlider.value = 70;
  }

  updateVolumeBackground(volumeSlider);
});

// Background Color Update
function updateVolumeBackground(el) {
  const min = el.min || 0;
  const max = el.max || 100;
  const val = el.value;

  const percentage = ((val - min) / (max - min)) * 100;
  el.style.background = `linear-gradient(to right, #4f46e5 0%, #4f46e5 ${percentage}%, #e5e7eb ${percentage}%, #e5e7eb 100%)`;
}

volumeSlider.addEventListener("input", () => {
  updateVolumeBackground(volumeSlider);

  // Save Sound Value
  const volume = parseInt(volumeSlider.value) / 100;
  localStorage.setItem('ambientVolume', volume);
  window.defaultVolume = volume;
  if (window.currentAudio) {
    window.currentAudio.volume = volume;
  }
});
</script>

  <div class="setting-item">
    <button data-i18n="logout" onclick="logout()"></button>
  </div>

  <div class="setting-item danger">
    <button data-i18n="delete-account" onclick="showDeleteAccountModal()"></button>
  </div>
  
  
  
  <!-- Delete Account Modal -->
<div id="deleteAccountModal" class="delete-account-overlay hidden">
  <div class="delete-account-box">
    <h3 id="deleteheader" data-i18n="delete-account"></h3>
    <p id="deletetext" data-i18n="delete-accounttext"></p>

    <input type="password" id="confirmPassword" data-i18n-placeholder="current-password" placeholder="">
    <input type="text" id="confirmDelete" data-i18n-placeholder="confirm-delete" placeholder="">

    <p id="deleteErrorMessage" style="color: red; font-size: 0.9rem;"></p>

    <div class="button-group">
      <button data-i18n="submit" onclick="confirmDeleteAccount()"></button>
      <button data-i18n="cancel" onclick="closeDeleteAccountModal()"></button>
    </div>
  </div>
</div>

<!-- + Button -->
<!-- Buton + Tooltip -->
<div style="position: absolute; bottom: 30px; right: 20px; z-index: 999;">

  <!-- Açılır Yazı -->
  <div id="tooltip" data-i18n="new_pdf" style="
    position: absolute;
    bottom: 70px;
    right: 0px;
    background: #2c2c2c;
    color: white;
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.5s ease, transform 0.5s ease;
    pointer-events: none;
    white-space: nowrap;
  ">
    Open New PDF
  </div>

  <!-- Buton -->
  <div class="plusbutton" id="plus-btn" style="
    width: 55px;
    height: 55px;
    background: var(--button-color);
    z-index: #999;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    cursor: pointer;
    font-size: 30px;
    animation: glow 3s linear forwards;
  ">
    +
  </div>
</div>

<!-- Gizli Dosya Seçici -->
<input type="file" id="file-input" style="display: none;" accept="application/pdf" />

<!-- Animasyon Tanımı -->
<style>
  @keyframes glow {
    0% {
      box-shadow: 0 0 5px #3f87ff, 0 0 10px #7f00ff;
    }
    25% {
      box-shadow: 0 0 10px #7f00ff, 0 0 15px #00ffcc;
    }
    50% {
      box-shadow: 0 0 15px #00ffcc, 0 0 20px #39ff14;
    }
    75% {
      box-shadow: 0 0 10px #39ff14, 0 0 15px #0099ff;
    }
    100% {
      box-shadow: 0 0 0px transparent;
    }
  }
</style>

<!-- JavaScript -->
<script>
  window.addEventListener("DOMContentLoaded", () => {
    const tooltip = document.getElementById("tooltip");

    // Tooltip göster
    setTimeout(() => {
      tooltip.style.opacity = "1";
      tooltip.style.transform = "translateY(0)";
    }, 200);

    setTimeout(() => {
      tooltip.style.opacity = "0";
      tooltip.style.transform = "translateY(10px)";
    }, 3200);
  });
</script>
