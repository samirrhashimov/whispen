<!DOCTYPE html>
<html>
<head>
  <title>Google Drive PDF Listesi (Yeni Giriş)</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>
</head>
<body>
  <h1>Google Drive PDF Listesi</h1>
  <div id="g_id_onload"
      data-client_id="326327822458-9blrp41tjmgbh0kvtqu5n00602mbcjve.apps.googleusercontent.com"
      data-callback="handleCredentialResponse">
  </div>
  <div class="g_id_signin" data-type="standard"></div>

  <ul id="drive-file-list"></ul>

  <script>
    const API_KEY = 'AIzaSyC-K_Bywpf1oMVb1Wj2_pU-zh0bsEfOSiM';

    function handleCredentialResponse(response) {
      const token = response.credential;
      gapi.load('client', () => {
        gapi.client.init({
          apiKey: API_KEY,
          discoveryDocs: ["https://www.googleapis.com/discovery/v1/apis/drive/v3/rest"]
        }).then(() => {
          gapi.client.setToken({access_token: token});
          listPDFFiles();
        });
      });
    }

    function listPDFFiles() {
      gapi.client.drive.files.list({
        q: "mimeType='application/pdf'",
        fields: "files(id, name, webViewLink, webContentLink)"
      }).then(response => {
        const files = response.result.files;
        const listEl = document.getElementById('drive-file-list');
        listEl.innerHTML = '';
        files.forEach(file => {
          const li = document.createElement('li');
          li.textContent = file.name;
          li.onclick = () => window.open(file.webContentLink, '_blank');
          listEl.appendChild(li);
        });
      }, err => {
        alert('Drive listeleme hatası: ' + JSON.stringify(err));
      });
    }
  </script>
</body>
</html>
