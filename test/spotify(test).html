<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Whispen Spotify Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #111; color: #fff; }
    button { padding: 8px 16px; background: #1db954; color: white; border: none; border-radius: 6px; margin-top: 10px; cursor: pointer; }
    .playlist { margin: 15px 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
  </style>
</head>
<body>

  <h1>🎧 Whispen - Spotify Test</h1>
  <button id="loginBtn">Spotify Giriş Yap</button>
  <div id="playlists"></div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    const CLIENT_ID = '9035202960c942ff95f0c303b9b0f997';
    const REDIRECT_URI = 'https://whispen.netlify.app/test/spotify(test).html';
    const SCOPES = 'user-read-private user-read-email playlist-read-private streaming user-modify-playback-state user-read-playback-state';

    const loginBtn = document.getElementById('loginBtn');
    const playlistsDiv = document.getElementById('playlists');

    function getAccessTokenFromUrl() {
      const hash = window.location.hash;
      if (!hash) return null;
      const params = new URLSearchParams(hash.substring(1));
      return params.get('access_token');
    }

    function redirectToSpotifyLogin() {
      const authUrl = `https://accounts.spotify.com/authorize?client_id=${CLIENT_ID}&response_type=token&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(SCOPES)}`;
      window.location.href = authUrl;
    }

    async function fetchPlaylists(token) {
      const res = await fetch('https://api.spotify.com/v1/me/playlists', {
        headers: { Authorization: 'Bearer ' + token }
      });
      const data = await res.json();
      playlistsDiv.innerHTML = `<h2>🎶 Playlist'lerin</h2>`;
      data.items.forEach(pl => {
        playlistsDiv.innerHTML += `
          <div class="playlist">
            <strong>${pl.name}</strong><br>
            <a href="${pl.external_urls.spotify}" target="_blank">
              <button>Spotify’da Aç</button>
            </a>
          </div>
        `;
      });
    }

    function setupSpotifyPlayer(token) {
      window.onSpotifyWebPlaybackSDKReady = () => {
        const player = new Spotify.Player({
          name: 'Whispen Web Player',
          getOAuthToken: cb => { cb(token); },
          volume: 0.5
        });

        player.addListener('ready', ({ device_id }) => {
          console.log('Spotify player hazır - device ID:', device_id);
        });

        player.connect();
      };
    }

    loginBtn.onclick = redirectToSpotifyLogin;

    const token = getAccessTokenFromUrl();
    if (token) {
      loginBtn.style.display = 'none';
      fetchPlaylists(token);
      setupSpotifyPlayer(token); // Premium varsa çalma da açılır
    }
  </script>
</body>
</html>
