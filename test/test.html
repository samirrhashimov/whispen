<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Whispen PDF Editor</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    canvas { border: 1px solid #ccc; display: block; margin: 20px 0; }
    #toolbar { margin-top: 10px; }
    input, button { margin: 5px 0; display: block; }
  </style>
</head>
<body>
  <h2>📄 Whispen PDF Editor</h2>

  <input type="file" id="fileInput" accept="application/pdf" />
  <canvas id="pdfCanvas"></canvas>

  <div id="toolbar">
    <input type="text" id="textInput" placeholder="Metin ekle (ör: imza)" />
    <button onclick="addText()">📝 Yazı Ekle</button>

    <input type="file" id="imageInput" accept="image/*" />
    <button onclick="addImage()">🖼️ Görsel Ekle</button>

    <button onclick="downloadPdf()">⬇️ PDF'yi İndir</button>
  </div>

  <!-- Kütüphaneler -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.min.js"></script>

  <script>
    let pdfDoc = null;
    let ctx = document.getElementById("pdfCanvas").getContext("2d");
    let originalBytes = null;

    document.getElementById("fileInput").addEventListener("change", async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      originalBytes = await file.arrayBuffer();

      // PDF.js ile görüntüle
      const loadingTask = pdfjsLib.getDocument({ data: originalBytes });
      const pdf = await loadingTask.promise;
      const page = await pdf.getPage(1);
      const viewport = page.getViewport({ scale: 1.5 });

      const canvas = document.getElementById("pdfCanvas");
      canvas.width = viewport.width;
      canvas.height = viewport.height;

      await page.render({ canvasContext: ctx, viewport: viewport }).promise;

      // PDF-Lib ile düzenlemeye hazırla
      pdfDoc = await PDFLib.PDFDocument.load(originalBytes);
    });

    async function addText() {
      const text = document.getElementById("textInput").value;
      if (!pdfDoc || !text) return;

      const pages = pdfDoc.getPages();
      const firstPage = pages[0];
      firstPage.drawText(text, {
        x: 50,
        y: 700,
        size: 20,
        color: PDFLib.rgb(0, 0, 0)
      });

      alert("📝 Yazı eklendi!");
    }

    async function addImage() {
      const fileInput = document.getElementById("imageInput");
      const file = fileInput.files[0];
      if (!file || !pdfDoc) return;

      const imgBytes = await file.arrayBuffer();
      const imgType = file.name.endsWith(".png") ? "png" : "jpg";

      let embeddedImage;
      if (imgType === "png") {
        embeddedImage = await pdfDoc.embedPng(imgBytes);
      } else {
        embeddedImage = await pdfDoc.embedJpg(imgBytes);
      }

      const page = pdfDoc.getPages()[0];
      const { width, height } = embeddedImage.scale(0.3);
      page.drawImage(embeddedImage, {
        x: 100,
        y: 500,
        width,
        height,
      });

      alert("🖼️ Görsel eklendi!");
    }

    async function downloadPdf() {
      if (!pdfDoc) return;

      const newBytes = await pdfDoc.save();
      const blob = new Blob([newBytes], { type: "application/pdf" });
      const url = URL.createObjectURL(blob);

      const link = document.createElement("a");
      link.href = url;
      link.download = "duzenlenmis.pdf";
      link.click();
    }
  </script>
</body>
</html>
