<!DOCTYPE html>
<html>
<head>
  <title>Drive PDF Listeleyici</title>
  <meta charset="UTF-8" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <h2>Drive'daki PDF Dosyalarını Listele</h2>
  <button onclick="authorizeAndListDrive()">Google Drive’a Bağlan</button>

  <ul id="file-list"></ul>

  <script>
    let tokenClient;

    window.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: '326327822458-9blrp41tjmgbh0kvtqu5n00602mbcjve.apps.googleusercontent.com',
        scope: 'https://www.googleapis.com/auth/drive.readonly',
        callback: (tokenResponse) => {
          if (tokenResponse.access_token) {
            listDriveFiles(tokenResponse.access_token);
          } else {
            alert('Erişim tokenı alınamadı.');
          }
        },
      });
    };

    function authorizeAndListDrive() {
      tokenClient.requestAccessToken();
    }

    function listDriveFiles(token) {
      fetch('https://www.googleapis.com/drive/v3/files?q=mimeType="application/pdf"&fields=files(id,name,webViewLink)', {
        headers: {
          'Authorization': 'Bearer ' + token
        }
      })
      .then(res => res.json())
      .then(data => {
        const list = document.getElementById('file-list');
        list.innerHTML = '';
        if (data.files && data.files.length > 0) {
          data.files.forEach(file => {
            const li = document.createElement('li');
            li.innerHTML = `<a href="${file.webViewLink}" target="_blank">${file.name}</a>`;
            list.appendChild(li);
          });
        } else {
          list.innerHTML = '<li>Hiç PDF bulunamadı.</li>';
        }
      })
      .catch(err => {
        alert('Drive listeleme hatası: ' + JSON.stringify(err));
      });
    }
  </script>
</body>
</html>
