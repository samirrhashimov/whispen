<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome - Whispen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }
    html {
      height: 100vh;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: url('./assets/images/abstract.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      perspective: 1000px;
    }

    #header {
      display: block;
      text-align: center;
    }
    
    .title {
      color: white;
      font-family: Comfortaa;
      font-size: 1.5rem;
      font-weight: bold;
      text-shadow: 1px 1px 8px rgba(0,0,0,0.3);
      height: 10px;
    }
    
   .subtitle {
      font-family: Poppins;
      color: #ccc;
      font-size: 12px;
    }

.screenshot {
  position: absolute;
  top: 5%;
  width: 75%;
  max-width: 360px;
  aspect-ratio: 9 / 17.5;
  border-radius: 16px;
  background-color: rgba(255, 255, 255, 0.1);
  background-size: cover;
  background-position: center;
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  
  transform: rotateY(-20deg) rotateX(15deg) scale(0.93);
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
  animation: screenshotEnter 2s ease-out forwards;
}

    .button-container {
      position: fixed;
      bottom: 20px;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 999;
    }

    .button {
      padding: 14px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .signup-btn {
      background-color: white;
      color: #333;
    }

    .signup-btn:hover {
      background-color: #f0f0f0;
    }

    .signin-btn {
      background-color: transparent;
      border: 2px solid white;
      color: white;
    }

    .signin-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    
.whispen-bg {
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background: radial-gradient(circle at 50% 50%, #2c255a, #0f0e1a 80%);
  overflow: hidden;
}

/* Işık dalgaları - çok katmanlı glow */
.whispen-bg::before,
.whispen-bg::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  width: 300%;
  height: 300%;
  top: -100%;
  left: -100%;
  background: radial-gradient(circle, rgba(150,100,255,0.15), transparent 60%);
  animation: glowPulse 30s ease-in-out infinite alternate;
  mix-blend-mode: screen;
  opacity: 0.4;
}

.whispen-bg::after {
  background: radial-gradient(circle, rgba(100,200,255,0.1), transparent 60%);
  animation-delay: 10s;
  opacity: 0.3;
}

/* Ana animasyon */
@keyframes glowPulse {
  0% {
    transform: scale(1) translate(0, 0);
  }
  50% {
    transform: scale(1.3) translate(20%, 10%);
  }
  100% {
    transform: scale(1) translate(0, 0);
  }
}

    @keyframes screenshotEnter {
  0% {
    opacity: 0;
    transform: perspective(1000px) rotateX(30deg) rotateZ(-20deg) scale(0.8) translateY(-40px);
  }
  50% {
    opacity: 0.8;
    transform: perspective(1000px) rotateY(-20deg) rotateX(7deg) scale(0.87);
  }
  100% {
    opacity: 1;
    transform: perspective(1000px) rotateY(-20deg) rotateX(15deg) scale(0.85);
  }
}
  </style>
</head>
<body>
  <div class="whispen-bg"></div>
  <div id="header">
    <p class="title">Whispen</p>
    <br>
    <p class="subtitle">“Read Calmly, Focus Deeply"</p>
  </div>
  
  <div class="screenshot" style="background-image: url('./assets/images/screenshot-main.jpg');">
  </div>

  <div class="button-container">
    <button class="button signup-btn" data-i18n="registertext" onclick="window.location.href='register.html'">Sign Up</button>
    <button class="button signin-btn" data-i18n="login" onclick="window.location.href='login.html'">Sign In</button>
  </div>
  
  
      <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
    <script src="scripts/language.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore-compat.js"></script>
    <script src="scripts/firebase-config.js"></script>
    <script src="scripts/login.js"></script>
</body>
</html>
