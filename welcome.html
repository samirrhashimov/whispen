<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Whispen - Welcome</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300..700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body {
      min-height: 100vh;
      background: url('./assets/images/abstract.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
    }

    .title {
      color: white;
      font-family: Comfortaa;
      font-size: 2rem;
      font-weight: bold;
      text-shadow: 1px 1px 8px rgba(0,0,0,0.3);
    }

    .screenshot {
      width: 85%;
      max-width: 360px;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.2);
      aspect-ratio: 9 / 16;
      background-color: rgba(255, 255, 255, 0.1);
      background-size: cover;
      background-position: center;
    }

    .button-container {
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .button {
      padding: 14px;
      font-size: 1rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.3s;
    }

    .signup-btn {
      background-color: white;
      color: #333;
    }

    .signup-btn:hover {
      background-color: #f0f0f0;
    }

    .signin-btn {
      background-color: transparent;
      border: 2px solid white;
      color: white;
    }

    .signin-btn:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
  </style>
</head>
<body>
  <div class="title" data-i18n="welcome_title">Whispen</div>

  <!-- Replace background-image URL with your real screenshot -->
  <div class="screenshot" style="background-image: url('./assets/screenshot-placeholder.png');"></div>

  <div class="button-container">
    <button class="button signup-btn" data-i18n="sign_up">Sign Up</button>
    <button class="button signin-btn" data-i18n="sign_in">Sign In</button>
  </div>
</body>
</html>
