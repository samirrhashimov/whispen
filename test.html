<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifier Test</title>
</head>
<body>
  <!-- Bildirim Paneli -->
  <div id="notifier" style="display:none;position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  width: 90%;
  height: 25px;
  background:#ff5252;
  color:white;
  padding:10px 16px;
  border-radius:6px;
  z-index:9999;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 2px 6px rgba(0,0,0,0.2);
  border: 0.5px solid #dd4242">
    <p id="notifier-message" style="margin:0;"></p>
    <button onclick="closeNotifier()" style="
    position: absolute;
    right: 10px;
    background:none;
    border:none;
    color:white;
    font-size:20px;
    cursor:pointer;
    ">×</button>
  </div>

  <script src="scripts/notifier.js"></script>
</body>
</html>
