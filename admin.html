<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifier Admin Panel</title>
  <style>
    body {
      font-family: "Inter", Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 3rem 1rem;
      margin: 0;
    }
    .panel {
      background: #1e293b;
      padding: 2rem;
      border-radius: 14px;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
      box-shadow: 0 6px 20px rgba(0,0,0,0.45);
      animation: fadeIn 0.4s ease-in-out;
    }
    h1 {
      font-size: 1.3rem;
      text-align: center;
      margin: 0 0 1rem 0;
      color: #38bdf8;
    }
    label {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 0.3rem;
    }
    textarea, select {
      padding: 0.65rem;
      border: none;
      border-radius: 8px;
      resize: none;
      font-size: 0.95rem;
      font-family: inherit;
    }
    textarea {
      min-height: 70px;
    }
    button {
      padding: 0.75rem;
      border: none;
      border-radius: 8px;
      background: #4f46e5;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.2s ease;
    }
    button:hover {
      background: #4338ca;
    }
    .status {
      text-align: center;
      font-size: 0.9rem;
      color: #38bdf8;
      min-height: 1.2rem;
    }
    @keyframes fadeIn {
      from {opacity: 0; transform: translateY(-10px);}
      to {opacity: 1; transform: translateY(0);}
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Notifier Admin</h1>

    <div>
      <label for="message">Notification Message</label>
      <textarea id="message" placeholder="Write your notification..."></textarea>
    </div>

    <div>
      <label for="status">Visibility</label>
      <select id="status">
        <option value="hidden">Hidden</option>
        <option value="visible">Visible</option>
      </select>
    </div>

    <button onclick="saveConfig()">Save Settings</button>
    <div id="saveStatus" class="status"></div>
  </div>

  <script>
    function loadConfig() {
      const saved = localStorage.getItem("notifierConfig");
      if (saved) {
        const config = JSON.parse(saved);
        document.getElementById("message").value = config.message || "";
        document.getElementById("status").value = config.status || "hidden";
      }
    }

    async function saveConfig() {
  const config = {
    message: document.getElementById("message").value,
    status: document.getElementById("status").value
  };

  try {
    const res = await fetch("/.netlify/functions/updateConfig", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(config)
    });

    if (res.ok) {
      document.getElementById("saveStatus").textContent = "✅ Settings Saved!";
    } else {
      document.getElementById("saveStatus").textContent = "❌ Error!";
    }

    setTimeout(() => {
      document.getElementById("saveStatus").textContent = "";
    }, 2500);
  } catch (err) {
    document.getElementById("saveStatus").textContent = "❌ Error!";
  }
}
  </script>
</body>
</html>
