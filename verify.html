<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" id="theme-color">
    <title>Email Verification</title>
    <link rel="stylesheet" href="styles/reset.css">
</head>
<body>
  <div style="position: absolute; top: 0.8rem; left: 1rem;">
  <select id="languageSelect" onchange="changeLanguage(this.value)">
    <option value="en">English</option>
    <option value="az">Azərbaycan</option>
    <option value="es">Español</option>
    <option value="tr">Türkçe</option>
    <option value="ru">Русский</option>
  </select>
</div>

<div class="emailicon">
<img class="emailgif" src="assets/images/email.gif">
</div>

 <div class="container">
<h1 data-i18n="verify-sent-title">A verification link has been sent to your email address.</h1>
<p>
  <span data-i18n="verify-sent-text">Please verify your email address then</span>
</p>
     <button onclick="window.location.href='login.html'" class="loginbuttonverify">Log In
  </button>
  
 </div>
 <script src="scripts/language.js"></script>
</body>
</html>
